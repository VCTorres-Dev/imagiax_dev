# ============================================================
# IMAGIAX — Rate limiting zones (http{} context)
#
# Montado directamente en /etc/nginx/conf.d/00-rate-zones.conf
# El prefijo "00-" garantiza que sea cargado ANTES que default.conf.
# NO pasa por envsubst (sin variables ${...}).
#
# Zonas limit_req:
#   auth_zone      — 5r/m  → /auth/, /login       (anti brute-force)
#   api_zone       — 30r/m → /api/                (general API)
#   analisis_zone  — 10r/m → /api/analizar, /api/generar (AI endpoints)
#   pacs_zone      — 60r/s → /pacs/               (WADO-RS streaming)
#
# Zonas limit_conn:
#   conn_api  — conexiones concurrentes en /api/
#   conn_pacs — conexiones concurrentes en /pacs/
# ============================================================

# ── Request rate zones ────────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr  zone=auth_zone:10m      rate=5r/m;
limit_req_zone  $binary_remote_addr  zone=api_zone:20m       rate=30r/m;
limit_req_zone  $binary_remote_addr  zone=analisis_zone:10m  rate=10r/m;
limit_req_zone  $binary_remote_addr  zone=pacs_zone:10m      rate=60r/s;

# ── Concurrent connection zones ───────────────────────────────────────────────
limit_conn_zone $binary_remote_addr  zone=conn_api:5m;
limit_conn_zone $binary_remote_addr  zone=conn_pacs:5m;

# ── Status codes for exceeded limits (default is 503) ────────────────────────
limit_req_status  429;
limit_conn_status 429;
