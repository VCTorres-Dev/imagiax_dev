# ============================================================
# IMAGIAX — Nginx reverse proxy (imagiax.dev)
#
# FASE 1 (HTTP): activa hasta obtener certificado SSL.
# Tras ejecutar certbot, reemplazar por la versión HTTPS.
#
#   /api/   → FastAPI backend (PyTorch + Gemini)   :8010
#   /pacs/  → Orthanc PACS (DICOMweb para OHIF)   :8042
#   /       → OHIF Viewer (React + nginx interno)  :80
# ============================================================

server {
    listen 80;
    server_name imagiax.dev www.imagiax.dev;

    # Let's Encrypt ACME challenge (certbot --webroot)
    # Certbot escribe aquí para probar que controlamos el dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permite subir archivos DICOM grandes (hasta 200 MB por instancia)
    client_max_body_size 200M;

    # ── FastAPI backend ───────────────────────────────────────────────────────
    # proxy_read_timeout 180s: cubre inferencia PyTorch (~30s) + Gemini (~60s)
    location /api/ {
        proxy_pass         http://fastapi:8010/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ── Orthanc DICOMweb ──────────────────────────────────────────────────────
    # OHIF usa /pacs/dicom-web para QIDO-RS/WADO-RS y /pacs/wado para WADO-URI
    location /pacs/ {
        proxy_pass         http://orthanc:8042/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sin límite de tiempo para descargar imágenes DICOM grandes
        proxy_read_timeout 300s;
    }

    # ── OHIF Viewer (catch-all) ───────────────────────────────────────────────
    # DEBE ir ÚLTIMO — es el bloque menos específico
    # El nginx interno de OHIF maneja el routing de React (SPA)
    location / {
        proxy_pass         http://ohif:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
