# ============================================================
# IMAGIAX — Nginx reverse proxy (imagiax.dev)
#
# HTTP → redirige a HTTPS (excepto ACME challenge)
# HTTPS → proxy inverso con headers de seguridad, compresión y caché
#
#   /api/   → FastAPI backend (PyTorch + Gemini)   :8010
#   /pacs/  → Orthanc PACS (DICOMweb para OHIF)   :8042
#   /       → OHIF Viewer (React + nginx interno)  :80
# ============================================================

# Ocultar versión de nginx en cabeceras y páginas de error
server_tokens off;

# ── Compresión gzip (HTTP level — válido en server/location también) ──────────
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_buffers      16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/octet-stream
    application/wasm
    image/svg+xml
    image/x-icon
    font/woff
    font/woff2
    application/font-woff
    application/font-woff2
    application/vnd.ms-fontobject;

# ── HTTP: redirect a HTTPS + ACME challenge ──────────────────────────────────
server {
    listen 80;
    server_name imagiax.dev www.imagiax.dev;

    # Let's Encrypt ACME challenge (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: proxy inverso principal ───────────────────────────────────────────
server {
    listen 443 ssl;
    server_name imagiax.dev www.imagiax.dev;

    # ── Certificados SSL (Let's Encrypt / certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/imagiax.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imagiax.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Headers de seguridad ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Content-Security-Policy ─────────────────────────────────────────────
    # OHIF requiere unsafe-inline/eval (WebGL, workers, wasm dinámico).
    # frame-ancestors 'none' previene clickjacking.
    # upgrade-insecure-requests fuerza HTTPS en recursos embebidos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    # Permite subir archivos DICOM grandes (hasta 200 MB por instancia)
    client_max_body_size 200M;

    # ── Rate limiting: respuesta 429 personalizada ────────────────────────────
    # Redirige los 429 de limit_req / limit_conn al named location @rate_limited
    # que devuelve JSON en vez del HTML genérico de nginx.
    error_page 429 = @rate_limited;

    # VER-002: Block path traversal attempts before any proxy block.
    # DICOM UIDs never contain ".."; any such request is malicious.
    # Must use $request_uri (raw, un-normalized) because nginx normalizes
    # ".." BEFORE location matching — a location ~* block never sees them.
    if ($request_uri ~* "\.\.") {
        return 403;
    }

    # ── Assets estáticos: caché agresiva (1 año, inmutable) ────────────────
    # Los bundles de OHIF usan hashes en el nombre, son safe para cache largo.
    location ~* \.(js|css|woff|woff2|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp|avif|wasm)$ {
        proxy_pass         http://ohif:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Accept-Encoding   $http_accept_encoding;
        expires            1y;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
        add_header         Vary "Accept-Encoding" always;
        # Heredar headers de seguridad también en estos bloques
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    }

    # ── AI/Análisis endpoints — DEBEN ir ANTES de /api/ (longest prefix match) ──
    # Aplican analisis_zone (10r/m + burst=2) más estricto que el api_zone general.
    # Se duplican los proxy headers porque add_header bloquea herencia del server{}.
    location /api/analizar/ {
        limit_req   zone=analisis_zone burst=2 nodelay;
        limit_conn  conn_api 5;
        proxy_pass         http://fastapi:8010/analizar/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    location /api/generar/ {
        limit_req   zone=analisis_zone burst=2 nodelay;
        limit_conn  conn_api 5;
        proxy_pass         http://fastapi:8010/generar/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    location /api/diagnostico/ {
        limit_req   zone=analisis_zone burst=2 nodelay;
        limit_conn  conn_api 5;
        proxy_pass         http://fastapi:8010/diagnostico/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # ── Health check endpoints — NO rate limiting ─────────────────────────────
    # Exact match overrides the /api/ prefix block. Monitoring systems and
    # health_check.sh poll these frequently — must never return 429.
    location = /api/salud {
        proxy_pass         http://fastapi:8010/salud;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control            "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    }

    location = /api/health/db {
        proxy_pass         http://fastapi:8010/health/db;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control            "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # ── FastAPI backend (prefijo /api/) ─────────────────────────────────────
    # proxy_read_timeout 180s: cubre inferencia PyTorch (~30s) + Gemini (~60s)
    location /api/ {
        limit_req   zone=api_zone burst=10 nodelay;
        limit_conn  conn_api 20;
        proxy_pass         http://fastapi:8010/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # ── Subrequest interno para auth_request ─────────────────────────────────
    location = /api/auth/verify {
        internal;
        proxy_pass               http://fastapi:8010/auth/verify;
        proxy_pass_request_body  off;
        proxy_set_header         Content-Length "";
        proxy_set_header         Cookie $http_cookie;
        proxy_set_header         X-Original-URI $request_uri;
        proxy_set_header         Host $host;
        proxy_set_header         X-Real-IP $remote_addr;
        proxy_set_header         X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header         X-Forwarded-Proto $scheme;
    }

    # ── Rutas públicas FastAPI (SIN auth_request) ──────────────────────────────
    # Estas rutas DEBEN ser accesibles sin autenticación.
    # Sin este bloque, caerían al catch-all location / que tiene auth_request
    # y provocarían un redirect loop infinito (el bug que rompía imagiax.dev).

    # Login — destino del redirect cuando auth falla
    location = /login {
        limit_req   zone=auth_zone burst=3 nodelay;
        proxy_pass         http://fastapi:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag             "noindex, nofollow" always;
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # Páginas públicas de pagos y precios
    location = /pagar {
        proxy_pass         http://fastapi:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # Webhooks de pago — llamados por MercadoPago/Transbank (sin cookie)
    location /pagos/webhook {
        proxy_pass         http://fastapi:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control            "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # Callback Transbank
    location /tbk/ {
        proxy_pass         http://fastapi:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control            "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # Health check — público, útil para monitoreo externo
    location = /salud {
        proxy_pass         http://fastapi:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        add_header Cache-Control            "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    }

    location = /health/db {
        proxy_pass         http://fastapi:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        add_header Cache-Control            "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # ── Panel de administración — no indexar por buscadores ──────────────────
    # FastAPI tiene su propio guard: redirige a /login si no hay sesión.
    # NO necesita auth_request en nginx (lo maneja la app).
    location /admin {
        proxy_pass         http://fastapi:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag             "noindex, nofollow" always;
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # ── Auth endpoints ───────────────────────────────────────────────────────
    location /auth/ {
        limit_req   zone=auth_zone burst=3 nodelay;
        limit_conn  conn_api 5;
        proxy_pass         http://fastapi:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag             "noindex, nofollow" always;
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "SAMEORIGIN" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # ── Orthanc DICOMweb — no indexar, no cachear ────────────────────────────
    location /pacs/ {
        limit_req   zone=pacs_zone burst=50 nodelay;
        limit_conn  conn_pacs 30;
        auth_request       /api/auth/verify;
        proxy_pass         http://orthanc:8042/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     "Basic ${ORTHANC_AUTH_HEADER}";
        proxy_read_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── SEO: robots.txt y sitemap.xml desde FastAPI ──────────────────────────
    location = /robots.txt {
        proxy_pass         http://fastapi:8010/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /sitemap.xml {
        proxy_pass         http://fastapi:8010/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Rate limit: respuesta JSON 429 ──────────────────────────────────────────
    # Devuelve un JSON estructurado con Retry-After en lugar del HTML por defecto.
    # add_header aquí no hereda los headers del server{} — se repiten los
    # de seguridad mínimos relevantes para respuestas de error.
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Please try again later.","retry_after":60}';
    }

    # ── Redirect interno de auth: produce HTTP 302 real con Location header ──
    # error_page 401 =302 /login en nginx NO emite Location header real —
    # sirve el body de /login con status 302 (comportamiento interno).
    # Los browsers (especialmente Firefox) interpretan 302 sin Location como error.
    # Solución: usar location @auth_redirect con return 302 que SÍ emite Location.
    location @auth_redirect {
        return 302 /login?returnTo=$request_uri;
    }

    # ── Clean URL estudio redirect → FastAPI ────────────────────────────────────
    # auth_request garantiza que solo usuarios autenticados accedan.
    # FastAPI devuelve 302 al viewer OHIF, nginx lo propaga al browser.
    location /estudio/ {
        auth_request       /api/auth/verify;
        error_page         401 = @auth_redirect;
        proxy_pass         http://fastapi:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Robots-Tag             "noindex, nofollow" always;
    }

    # ── OHIF Viewer (catch-all) ───────────────────────────────────────────────
    # DEBE ir ÚLTIMO — es el bloque menos específico
    # Nota: add_header en location bloquea herencia del server{} — todos los
    # headers de seguridad deben repetirse aquí explícitamente.
    location / {
        auth_request       /api/auth/verify;
        error_page         401 = @auth_redirect;
        proxy_pass         http://ohif:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Accept-Encoding   $http_accept_encoding;
        # HTML principal: siempre fresco (SPA entry point)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        # Security headers (deben repetirse por limitación de nginx add_header)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; upgrade-insecure-requests;" always;
    }
}
