# ============================================================
# IMAGIAX — Stack completo para DigitalOcean (o cualquier VPS)
#
# NO modifica ni reemplaza docker-compose.yml (entorno local intacto)
#
# Uso en el servidor:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f fastapi
#   docker compose -f docker-compose.prod.yml ps
# ============================================================

services:

  # ── Orthanc PACS ─────────────────────────────────────────────────────────────
  orthanc:
    image: jodogne/orthanc-plugins:latest
    container_name: orthanc-imagiax
    ports:
      - "8042:8042"    # Solo para subir DICOMs. Cerrar tras la carga inicial.
      # 4242 (DICOM C-STORE) no se expone — no es necesario para el viewer web
    volumes:
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db/
    restart: unless-stopped
    environment:
      - ORTHANC_NAME=IMAGIAX-PACS

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres-imagiax
    # Sin "ports:" — no expuesto al exterior, solo accesible en red Docker interna
    volumes:
      - imagiax-pgdata:/var/lib/postgresql/data
    env_file:
      - ../../.env.production    # provee POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: imagiax
      POSTGRES_USER: imagiax
      # POSTGRES_PASSWORD se lee de .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagiax -d imagiax"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI + PyTorch ─────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ../../           # raíz del proyecto (donde está el Dockerfile)
      dockerfile: Dockerfile
    container_name: fastapi-imagiax
    volumes:
      # Cachea el modelo resnet50-res512-all (~90 MB) entre reinicios
      - torchxrayvision-cache:/root/.torchxrayvision
    env_file:
      - ../../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_started
    restart: unless-stopped

  # ── OHIF Viewer ───────────────────────────────────────────────────────────────
  ohif:
    build:
      context: "../Viewers"     # OHIF Medical Imaging Viewer/Viewers/
      dockerfile: Dockerfile
    container_name: ohif-imagiax
    environment:
      # El entrypoint.sh oficial de OHIF escribe este contenido en app-config.js
      # al arrancar. Rutas relativas (/api, /pacs) → funciona con cualquier IP
      # sin necesidad de recompilar.
      APP_CONFIG: |
        window.config = {
          routerBasename: null,
          showStudyList: true,
          extensions: [],
          modes: [],
          whiteLabeling: {
            createLogoComponentFn: function(React) {
              return React.createElement('div', {
                style: { display: 'flex', alignItems: 'center', gap: '10px' }
              },
                React.createElement('div', {
                  style: {
                    width: '30px', height: '30px', borderRadius: '7px',
                    background: 'linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    flexShrink: '0', boxShadow: '0 2px 8px rgba(37,99,235,0.4)'
                  }
                },
                  React.createElement('span', {
                    style: { color: '#fff', fontWeight: '900', fontSize: '11px', letterSpacing: '-0.5px', fontFamily: 'system-ui, sans-serif' }
                  }, 'IX')
                ),
                React.createElement('span', {
                  style: { color: '#ffffff', fontWeight: '800', fontSize: '15px', letterSpacing: '3px', fontFamily: 'system-ui, -apple-system, sans-serif' }
                }, 'IMAGIAX')
              );
            }
          },
          showWarningMessageForCrossOrigin: false,
          showCPUFallbackMessage: true,
          showLoadingIndicator: true,
          strictZSpacingForVolumeViewport: true,
          defaultDataSourceName: 'orthancProxy',
          dataSources: [{
            namespace: '@ohif/extension-default.dataSourcesModule.dicomweb',
            sourceName: 'orthancProxy',
            configuration: {
              friendlyName: 'IMAGIAX PACS',
              name: 'Orthanc',
              wadoUriRoot: '/pacs/wado',
              qidoRoot: '/pacs/dicom-web',
              wadoRoot: '/pacs/dicom-web',
              qidoSupportsIncludeField: false,
              imageRendering: 'wadors',
              thumbnailRendering: 'wadors',
              dicomUploadEnabled: true,
              omitQuotationForMultipartRequest: true,
            },
          }],
        };
        window.__IMAGIAX_API_URL__ = '/api';
        window.__IMAGIAX_V2_API_URL__ = '/api';
        window.__IMAGIAX_CONFIG__ = { backend_url: '/api' };
    restart: unless-stopped

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx-imagiax
    ports:
      - "80:80"
      - "443:443"   # HTTPS — activo tras obtener certificado con certbot
    volumes:
      - ./config/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados SSL de Let's Encrypt (certbot los escribe en el host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Directorio webroot para el challenge ACME de certbot
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - orthanc
      - fastapi
      - ohif
    restart: unless-stopped

volumes:
  orthanc-data:
  imagiax-pgdata:
  torchxrayvision-cache:
