# ============================================================
# security-headers.conf — Shared security headers snippet
#
# LOW-1: nginx drops parent add_header directives when a location
# block defines its own add_header. Include this file at the START
# of every location block that has custom add_header directives so
# all security headers are consistently emitted.
#
# Mount into nginx at: /etc/nginx/conf.d/security-headers.conf
# Usage inside a location block:
#   include /etc/nginx/conf.d/security-headers.conf;
# ============================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
